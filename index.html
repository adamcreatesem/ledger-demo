<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ledger, production cost tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050505'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='36' font-weight='800' fill='%23a78bfa' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --card: rgba(255, 255, 255, 0.035);
    --hairline: rgba(255, 255, 255, 0.09);
    --text: #f4f4f6;
    --dim: #9aa0ab;
    --faint: #6b7280;
    --green: #4ade80;
    --red: #f87171;
    --accent: #a78bfa;
    --accent-strong: #7c3aed;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    font-family: "Plus Jakarta Sans", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(124, 58, 237, 0.16), transparent 60%),
      radial-gradient(700px 420px at -15% 30%, rgba(74, 222, 128, 0.07), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    max-width: 560px;
    margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) 18px calc(44px + env(safe-area-inset-bottom));
    font-size: 16px;
    line-height: 1.5;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 20px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sample-pill {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); border: 1px solid rgba(167, 139, 250, 0.35);
    border-radius: 999px; padding: 5px 12px; background: rgba(124, 58, 237, 0.10);
  }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 14px 12px 12px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 18px 40px -28px rgba(0, 0, 0, 0.9);
  }
  .stat-card .label { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .stat-card .value { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }
  .stat-card .sub { font-size: 11px; color: var(--faint); margin-top: 2px; min-height: 15px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--hairline);
    border-radius: 20px;
    padding: 18px 16px;
    margin-bottom: 14px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 18px 40px -28px rgba(0, 0, 0, 0.9);
  }
  .panel h2 {
    font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 6px;
  }
  .cost-row {
    display: grid; grid-template-columns: 1fr auto 44px; gap: 8px; align-items: center;
    padding: 11px 0; border-bottom: 1px solid var(--hairline); font-size: 15px;
    animation: row-in 0.34s var(--ease-out) both;
  }
  .cost-row:last-of-type { border-bottom: none; }
  .cost-row.leaving { opacity: 0; transform: translateX(10px); transition: opacity 0.18s ease-out, transform 0.18s ease-out; }
  .cost-row .name { font-weight: 600; }
  .cost-row .per { color: var(--faint); font-size: 12px; margin-top: 1px; }
  .cost-row .amt { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .remove-btn {
    width: 36px; height: 36px; margin: 0 auto; display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid transparent; border-radius: 12px;
    color: var(--faint); font-size: 17px; cursor: pointer;
    transition: background 0.15s ease-out, color 0.15s ease-out, transform 0.1s ease-out;
  }
  .remove-btn:active { transform: scale(0.9); background: rgba(248, 113, 113, 0.12); color: var(--red); }
  .empty-hint { color: var(--faint); font-size: 14px; padding: 12px 0 4px; }
  .entry-form { display: grid; grid-template-columns: 1fr 104px 96px; gap: 8px; margin-top: 12px; }
  .entry-form input, .entry-form select {
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--hairline); color: var(--text);
    border-radius: 12px; padding: 12px 12px; font-size: 16px; width: 100%; min-width: 0;
    font-family: inherit; transition: border-color 0.15s ease-out;
  }
  .entry-form input::placeholder { color: var(--faint); }
  .entry-form input:focus, .entry-form select:focus { outline: none; border-color: rgba(167, 139, 250, 0.55); }
  .add-btn {
    grid-column: 1 / -1;
    background: var(--accent-strong); border: none; color: #fff;
    padding: 13px; border-radius: 13px; font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit; letter-spacing: 0.01em;
    transition: transform 0.1s ease-out, filter 0.15s ease-out;
  }
  .add-btn:active { transform: scale(0.975); filter: brightness(1.12); }
  .breakdown-bar { height: 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); overflow: hidden; display: flex; margin-top: 10px; }
  .breakdown-bar i { display: block; height: 100%; width: 0; transition: width 0.6s var(--ease-out); }
  .breakdown-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; font-size: 12px; color: var(--dim); }
  .breakdown-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
  .insight { margin-top: 12px; font-size: 13px; color: var(--dim); }
  .insight b { color: var(--text); font-weight: 700; }
  .sale-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--hairline); font-size: 15px;
    animation: row-in 0.34s var(--ease-out) both;
  }
  .sale-row:last-of-type { border-bottom: none; }
  .sale-row .name { font-weight: 600; }
  .sale-row .detail { color: var(--faint); font-size: 12px; margin-top: 1px; }
  .sale-row .amt { font-weight: 800; font-variant-numeric: tabular-nums; }
  .site-footer { text-align: center; margin-top: 26px; }
  .site-footer p { font-size: 12.5px; color: var(--faint); line-height: 1.7; }
  .site-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .reset-btn {
    background: none; border: none; color: var(--faint); font-size: 12px; cursor: pointer;
    margin-top: 8px; padding: 8px 10px; font-family: inherit; text-decoration: underline; text-underline-offset: 3px;
  }
  .reset-btn:active { color: var(--text); }
  @keyframes row-in {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Ledger<span>.</span></h1>
  <div class="sample-pill">Sample data</div>
</header>

<div class="cards">
  <div class="stat-card">
    <div class="label">Costs</div>
    <div class="value" id="kpi-costs">0</div>
    <div class="sub" id="kpi-costs-sub"></div>
  </div>
  <div class="stat-card">
    <div class="label">Sales</div>
    <div class="value green" id="kpi-sales">0</div>
    <div class="sub" id="kpi-sales-sub"></div>
  </div>
  <div class="stat-card">
    <div class="label">Margin</div>
    <div class="value" id="kpi-margin">0</div>
    <div class="sub" id="kpi-margin-sub"></div>
  </div>
</div>

<div class="panel">
  <h2>Production costs</h2>
  <div id="cost-list"></div>
  <form id="cost-form" class="entry-form" autocomplete="off">
    <input id="c-name" placeholder="What did you spend on?" required maxlength="40">
    <input id="c-amt" type="number" inputmode="numeric" min="1" placeholder="Birr" required>
    <select id="c-per" aria-label="Cost repeats">
      <option value="batch">per batch</option>
      <option value="month">per month</option>
      <option value="week">per week</option>
    </select>
    <button class="add-btn" type="submit">Add cost</button>
  </form>
</div>

<div class="panel">
  <h2>Where the money goes</h2>
  <div id="breakdown-area">
    <div class="breakdown-bar" id="bar" role="img" aria-label="Cost breakdown bar"></div>
    <div class="breakdown-legend" id="legend"></div>
    <div class="insight" id="insight"></div>
  </div>
  <div class="empty-hint" id="breakdown-empty" hidden>Add a cost to see the breakdown.</div>
</div>

<div class="panel">
  <h2>Sales this month</h2>
  <div id="sales-list"></div>
  <form id="sale-form" class="entry-form" autocomplete="off">
    <input id="s-name" placeholder="What did you sell?" required maxlength="40">
    <input id="s-amt" type="number" inputmode="numeric" min="1" placeholder="Price" required>
    <input id="s-qty" type="number" inputmode="numeric" min="1" placeholder="Qty" required>
    <button class="add-btn" type="submit">Add sale</button>
  </form>
</div>

<div class="site-footer">
  <p>Demo by <a href="https://adamcreates.netlify.app" target="_blank" rel="noopener">Adam Creates</a><br>
  Your real version saves to your phone automatically, works offline,<br>and nothing ever leaves your device.</p>
  <button class="reset-btn" id="reset-btn" type="button">Reset sample data</button>
</div>

<script>
const COLORS = ['#a78bfa', '#4ade80', '#f59e0b', '#38bdf8', '#f87171', '#e879f9'];
const STORE_KEY = 'ledger-demo-v2';
const DEFAULT_COSTS = [
  { name: 'Flour, sugar and oil', amt: 4200, per: 'batch' },
  { name: 'Packaging', amt: 1400, per: 'batch' },
  { name: 'Transport and delivery', amt: 900, per: 'week' },
  { name: 'Electricity', amt: 650, per: 'month' },
];
const DEFAULT_SALES = [
  { name: 'Wholesale, corner shops', amt: 850, qty: 8 },
  { name: 'Direct to customers', amt: 350, qty: 12 },
];

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && Array.isArray(saved.costs) && Array.isArray(saved.sales)) return saved;
  } catch (err) { /* corrupted storage falls through to sample data */ }
  return { costs: DEFAULT_COSTS.slice(), sales: DEFAULT_SALES.slice() };
}

let data = loadData();
const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(data));
const fmt = n => Number(n).toLocaleString('en-US') + ' br';
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

function animateNumber(el, to) {
  const from = Number(el.dataset.v || 0);
  el.dataset.v = to;
  if (from === to) { el.textContent = fmt(to); return; }
  const start = performance.now();
  const DURATION = 450;
  function step(now) {
    const t = Math.min((now - start) / DURATION, 1);
    el.textContent = fmt(Math.round(from + (to - from) * easeOutCubic(t)));
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderCosts() {
  const list = document.getElementById('cost-list');
  list.innerHTML = '';
  if (!data.costs.length) {
    list.innerHTML = '<div class="empty-hint">No costs yet. Add your first one below.</div>';
    return;
  }
  data.costs.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'cost-row';
    row.style.animationDelay = Math.min(i * 45, 240) + 'ms';
    row.innerHTML =
      '<div><div class="name"></div><div class="per"></div></div>' +
      '<div class="amt"></div>' +
      '<button class="remove-btn" type="button" aria-label="Remove ' + c.name.replace(/"/g, '') + '">×</button>';
    row.querySelector('.name').textContent = c.name;
    row.querySelector('.per').textContent = 'per ' + c.per;
    row.querySelector('.amt').textContent = fmt(c.amt);
    row.querySelector('.remove-btn').addEventListener('click', () => {
      row.classList.add('leaving');
      setTimeout(() => { data.costs.splice(i, 1); save(); render(); }, 180);
    });
    list.appendChild(row);
  });
}

function renderSales() {
  const list = document.getElementById('sales-list');
  list.innerHTML = '';
  if (!data.sales.length) {
    list.innerHTML = '<div class="empty-hint">No sales yet. Add your first one below.</div>';
    return;
  }
  data.sales.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'sale-row';
    row.style.animationDelay = Math.min(i * 45, 240) + 'ms';
    row.innerHTML =
      '<div><div class="name"></div><div class="detail"></div></div>' +
      '<div class="amt"></div>';
    row.querySelector('.name').textContent = s.name;
    row.querySelector('.detail').textContent = s.qty + ' × ' + fmt(s.amt);
    row.querySelector('.amt').textContent = fmt(s.amt * s.qty);
    list.appendChild(row);
  });
}

function renderTotals() {
  const totalCost = data.costs.reduce((sum, c) => sum + c.amt, 0);
  const totalSales = data.sales.reduce((sum, s) => sum + s.amt * s.qty, 0);
  const margin = totalSales - totalCost;

  animateNumber(document.getElementById('kpi-costs'), totalCost);
  animateNumber(document.getElementById('kpi-sales'), totalSales);
  animateNumber(document.getElementById('kpi-margin'), Math.abs(margin));

  const marginEl = document.getElementById('kpi-margin');
  marginEl.className = 'value ' + (margin < 0 ? 'red' : 'green');
  document.getElementById('kpi-margin-sub').textContent =
    (margin < 0 ? 'losing ' : '') + (totalSales ? Math.round(Math.abs(margin) / totalSales * 100) + '% of sales' : '');
  document.getElementById('kpi-costs-sub').textContent =
    data.costs.length ? data.costs.length + ' cost line' + (data.costs.length > 1 ? 's' : '') : '';
  document.getElementById('kpi-sales-sub').textContent =
    data.sales.reduce((sum, s) => sum + s.qty, 0) + ' items sold';

  const bar = document.getElementById('bar');
  const legend = document.getElementById('legend');
  const insight = document.getElementById('insight');
  const empty = document.getElementById('breakdown-empty');
  document.getElementById('breakdown-area').hidden = !data.costs.length;
  empty.hidden = !!data.costs.length;
  bar.innerHTML = ''; legend.innerHTML = ''; insight.innerHTML = '';
  let biggest = null;
  data.costs.forEach((c, i) => {
    if (!biggest || c.amt > biggest.amt) biggest = c;
    const seg = document.createElement('i');
    seg.style.background = COLORS[i % COLORS.length];
    bar.appendChild(seg);
    const item = document.createElement('span');
    const swatch = document.createElement('i');
    swatch.style.background = COLORS[i % COLORS.length];
    item.appendChild(swatch);
    item.appendChild(document.createTextNode(c.name));
    legend.appendChild(item);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      seg.style.width = totalCost ? (c.amt / totalCost * 100) + '%' : '0%';
    }));
  });
  if (biggest && totalCost) {
    const strong = document.createElement('b');
    strong.textContent = biggest.name + ' (' + Math.round(biggest.amt / totalCost * 100) + '%)';
    insight.append('Biggest cost: ');
    insight.appendChild(strong);
  }
}

function render() { renderCosts(); renderSales(); renderTotals(); }

document.getElementById('cost-form').addEventListener('submit', e => {
  e.preventDefault();
  data.costs.push({
    name: document.getElementById('c-name').value.trim(),
    amt: Math.round(+document.getElementById('c-amt').value),
    per: document.getElementById('c-per').value,
  });
  e.target.reset();
  save();
  render();
});

document.getElementById('sale-form').addEventListener('submit', e => {
  e.preventDefault();
  data.sales.push({
    name: document.getElementById('s-name').value.trim(),
    amt: Math.round(+document.getElementById('s-amt').value),
    qty: Math.max(1, Math.round(+document.getElementById('s-qty').value)),
  });
  e.target.reset();
  save();
  render();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  localStorage.removeItem(STORE_KEY);
  data = { costs: DEFAULT_COSTS.slice(), sales: DEFAULT_SALES.slice() };
  render();
});

render();
</script>
</body>
</html>
